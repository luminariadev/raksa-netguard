name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run vet and race tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build cross-platform release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          rm -rf dist stage
          mkdir -p dist

          build_target() {
            local os="$1"
            local arch="$2"
            local ext="$3"
            local pkg="raksa-netguard-${VERSION}-${os}-${arch}"
            local bin="raksa-netguard${ext}"
            local dir="stage/${pkg}"

            mkdir -p "${dir}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${dir}/${bin}" ./cmd/raksa-netguard
            cp README.md LICENSE configs/baseline.example.yaml "${dir}/"

            if [ "${os}" = "windows" ]; then
              (cd stage && zip -rq "../dist/${pkg}.zip" "${pkg}")
            else
              tar -C stage -czf "dist/${pkg}.tar.gz" "${pkg}"
            fi
          }

          build_target linux amd64 ""
          build_target linux arm64 ""
          build_target darwin arm64 ""
          build_target windows amd64 ".exe"

          (cd dist && sha256sum *.tar.gz *.zip > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .)

      - name: Extract changelog release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_sec=1; next }
            in_sec && /^## \[/ { exit }
            in_sec { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "$RELEASE_TAG" > release_notes.md
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local delays=(5 15)
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              local delay="${delays[$((attempt - 1))]}"
              echo "Attempt $attempt failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            retry gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release_notes.md
          fi

          retry gh release upload "$RELEASE_TAG" dist/* --clobber

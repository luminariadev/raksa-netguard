name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run vet and race tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build cross-platform release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"

          rm -rf dist stage
          mkdir -p dist

          build_target() {
            local os="$1"
            local arch="$2"
            local ext="$3"
            local pkg="raksa-netguard-${VERSION}-${os}-${arch}"
            local bin="raksa-netguard${ext}"
            local dir="stage/${pkg}"

            mkdir -p "${dir}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${dir}/${bin}" ./cmd/raksa-netguard
            cp README.md LICENSE configs/baseline.example.yaml "${dir}/"

            if [ "${os}" = "windows" ]; then
              (cd stage && zip -rq "../dist/${pkg}.zip" "${pkg}")
            else
              tar -C stage -czf "dist/${pkg}.tar.gz" "${pkg}"
            fi
          }

          build_target linux amd64 ""
          build_target linux arm64 ""
          build_target darwin arm64 ""
          build_target windows amd64 ".exe"

          (cd dist && sha256sum *.tar.gz *.zip > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Vet, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check known Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Validate bundled example policy
        run: go run ./cmd/raksa-netguard policy-check --policy configs/baseline.example.yaml --fail-on high

      - name: Verify distributed scan fixture
        run: |
          out=$(go run ./cmd/raksa-netguard analyze --policy configs/baseline.example.yaml --log testdata/distributed_scan.jsonl --format table)
          echo "$out"
          echo "$out" | grep -q "NET-104"

      - name: Verify Windows Firewall fixture and rule catalog
        run: |
          fw=$(go run ./cmd/raksa-netguard analyze --log testdata/windows_pfirewall.log --log-format windows-fw --format table)
          echo "$fw"
          echo "$fw" | grep -q "NET-101"
          go run ./cmd/raksa-netguard rules --format json | grep -q "NET-104"

      - name: Cross-compile release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/raksa-netguard-linux-amd64 ./cmd/raksa-netguard
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/raksa-netguard-windows-amd64.exe ./cmd/raksa-netguard

  docker:
    name: Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build distroless non-root image
        run: docker build -t raksa-netguard:ci .
